spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/husseineelsaka/Enterprise-E-Commerce-Platform-Config-Repo
          default-label: main
          clone-on-start: true

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health, info